<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#132725">
<title>Stilt House</title>
<style>
  :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#faf8ed;background:#183331;font-size:14px}
  *{box-sizing:border-box}body{margin:0;overflow:hidden}#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:0}
  .ui{position:fixed;inset:0;pointer-events:none;padding:clamp(12px,2.8vw,36px);display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto;gap:12px;align-items:start}
  .glass{background:#152721c9;border:1px solid #ffffff35;box-shadow:0 9px 34px #081b1b30;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:auto}
  .identity{justify-self:start;padding:15px 20px 14px;border-radius:20px}.identity h1{font:400 clamp(26px,3.5vw,43px)/1 Georgia,serif;letter-spacing:-.045em;margin:0 0 7px}.identity p{margin:0 0 11px;color:#e4ebdf;font-size:.84rem;white-space:nowrap}.badges{display:flex;gap:6px}.badge{border:1px solid #d4ead15c;border-radius:999px;padding:3px 7px;font-size:.69rem;letter-spacing:.045em;color:#e6efde;font-variant-numeric:tabular-nums}#fps{min-width:48px;text-align:center}
  .toggle,.cameras{display:flex;gap:4px;padding:5px;border-radius:25px}.cameras{grid-column:1/-1;grid-row:3;justify-self:center;justify-content:center;flex-wrap:wrap}
  button{appearance:none;border:1px solid transparent;border-radius:999px;background:transparent;color:inherit;padding:9px 13px;font-family:inherit;font-size:.81rem;font-weight:600;line-height:1.1;white-space:nowrap;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
  button:hover{background:#fff2}button:focus-visible{outline:2px solid #fff2bb;outline-offset:2px}button[aria-pressed="true"]{background:#fff0c9;color:#283129;border-color:#fff6db}.restore{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));padding:10px 16px}
  [hidden]{display:none!important}#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(86vw,28rem);margin:0;padding:15px 20px;border-radius:18px;text-align:center}
  #walk-hud{position:fixed;inset:0;pointer-events:none}
  .crosshair{position:absolute;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%);filter:drop-shadow(0 1px 1px #000b)}
  .crosshair::before,.crosshair::after{content:"";position:absolute;inset:5px 0;background:#fff8e7;border-radius:2px}
  .crosshair::after{inset:0 5px}
  #walk-hint{position:absolute;left:50%;top:calc(50% + 22px);transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);padding:11px 16px;margin:0;border-radius:14px;text-align:center;pointer-events:none}
  #interaction{position:absolute;left:50%;top:calc(50% + 24px);transform:translateX(-50%);width:max-content;max-width:90vw;padding:8px 12px;border-radius:10px;pointer-events:none}
  @media(max-width:680px){.ui{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto;gap:8px}.toggle{grid-row:2;justify-self:start;flex-wrap:wrap}.cameras{grid-row:4}.identity{padding:10px 13px}.identity p{margin-bottom:7px}button{padding:8px 10px}}
  @media(max-height:460px) and (min-width:681px){.ui{padding:10px}.identity{padding:9px 13px}}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>

<body>
<canvas id="view" aria-label="Interactive 3D view of a coastal stilt house"></canvas>
<div class="ui" id="ui">
  <section class="glass identity" aria-label="Scene information">
    <h1>Stilt House</h1><p id="camera-help">Drag to orbit 360° · Scroll to zoom</p>
    <div class="badges"><span class="badge" id="renderer">WebGL 2</span><output class="badge" id="fps" aria-label="Frames per second">— FPS</output></div>
  </section>
  <div class="glass toggle" role="group" aria-label="Scene settings">
    <button data-setting="golden" aria-pressed="false">Golden Hour</button><button data-setting="dusk" aria-pressed="false">Dusk</button><button data-setting="wind" aria-pressed="false">Wind</button><button id="clean" aria-pressed="false">Clean View</button>
  </div>
  <nav class="glass cameras" aria-label="Camera presets">
    <button id="walk" data-camera="walk" aria-pressed="false" hidden>Walk</button>
    <button id="inside" data-camera="inside" aria-pressed="false" hidden>Inside</button>
    <button data-camera="bay" aria-pressed="true">Bay Deck</button><button data-camera="street" aria-pressed="false">Street Side</button><button data-camera="aerial" aria-pressed="false">Aerial</button><button data-camera="under" aria-pressed="false">Under the House</button><button data-camera="dock" aria-pressed="false">Dock View</button><button data-camera="orbit" aria-pressed="false">Orbit</button>
  </nav>
</div>
<div id="walk-hud" hidden>
  <span class="crosshair" aria-hidden="true"></span>
  <p class="glass" id="walk-hint" lang="tr">Tıkla ve gez — WASD, Shift, Space, E, Esc</p>
  <output class="glass" id="interaction" lang="tr" hidden></output>
</div>
<button class="glass restore" id="restore" hidden>Restore View</button>
<p class="glass" id="status" role="status">Loading 3D scene…</p>
<script type="module">
const status = document.getElementById('status');
try {
  const [THREE, { OrbitControls }] = await Promise.all([
    import('three'), import('three/addons/controls/OrbitControls.js')
  ]);
  launch(THREE, OrbitControls);
  status.hidden = true;
} catch (error) {
  status.textContent = error.message === 'WebGL 2 unavailable'
    ? 'Enable WebGL 2 in Chrome to open this scene.'
    : 'Could not open the scene. Check your connection to unpkg.com and reload.';
  document.getElementById('renderer').textContent = 'Unavailable';
  console.error(error);
}

function launch(T, OrbitControls) {
  // East is +X. South, toward the bay, is +Z.
  const canvas = document.getElementById('view');
  const context = canvas.getContext('webgl2', {antialias:true, alpha:false, powerPreference:'high-performance'});
  if (!context) throw new Error('WebGL 2 unavailable');
  const renderer = new T.WebGLRenderer({canvas, context, antialias:true});
  renderer.outputColorSpace = T.SRGBColorSpace;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.autoUpdate = false;
  const scene = new T.Scene();
  scene.fog = new T.FogExp2('#a7c7ce', .0096);
  const camera = new T.PerspectiveCamera(42, 1, .13, 990);
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = .075;
  controls.enablePan = false;
  controls.minDistance = 4;
  controls.maxDistance = 110;
  controls.maxPolarAngle = Math.PI / 2 - .012;
  controls.autoRotateSpeed = .52;

  const V = (x,y,z) => new T.Vector3(x,y,z);
  const color = (value) => new T.Color(value);
  const {PI, sin, cos, floor, sqrt} = Math;
  const lerp = (a,b,t) => a + (b-a)*t;
  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  const smooth = (a,b,t) => {const u = clamp((t-a)/(b-a),0,1); return u*u*(3-2*u);};
  const walkSolids=[],walkSurfaces=[];
  function walkBox(x,z,width,depth,bottom,top,angle=0,rise=0) {
    const solid={x,z,halfX:width/2,halfZ:depth/2,bottom,top,c:cos(angle),s:sin(angle),rise};
    walkSolids.push(solid);
    return solid;
  }
  function walkBarrier(a,b,width,bottom,top,rise=0) {
    const dx=b[0]-a[0],dz=b[1]-a[1],length=Math.hypot(dx,dz);
    if(length>0) walkBox((a[0]+b[0])/2,(a[1]+b[1])/2,width,length+width,bottom,top,Math.atan2(dx,dz),rise);
  }
  function walkDeck(x1,x2,z1,z2,y,cut=0,thickness=.24) {
    walkSurfaces.push({x1,x2,z1,z2,y,cut,thickness});
  }
  let seed = 734297;
  function rand() {
    seed = (Math.imul(seed,1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  const range = (a,b) => lerp(a,b,rand());
  const pick = list => list[floor(rand()*list.length)];
  function hash(x,z) {
    let h = Math.imul(x,374761393) + Math.imul(z,668265263);
    h = Math.imul(h ^ (h >>> 13),1274126177);
    return ((h ^ (h >>> 16)) >>> 0)/4294967295;
  }
  function noise(x,z) {
    const i=floor(x),j=floor(z),a=smooth(0,1,x-i),b=smooth(0,1,z-j);
    return lerp(lerp(hash(i,j),hash(i+1,j),a),lerp(hash(i,j+1),hash(i+1,j+1),a),b);
  }
  function surface(c, options={}) {return new T.MeshStandardMaterial({color:c,roughness:.81,...options});}
  function texture(size, draw, srgb=true) {
    const image = document.createElement('canvas');
    image.width=image.height=size;
    const ctx=image.getContext('2d');
    draw(ctx,size);
    const map=new T.CanvasTexture(image);
    map.wrapS=map.wrapT=T.RepeatWrapping;
    map.colorSpace=srgb ? T.SRGBColorSpace : T.NoColorSpace;
    map.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
    return map;
  }
  const woodMap = texture(256,(ctx,n)=>{
    ctx.fillStyle='#ded9cb'; ctx.fillRect(0,0,n,n);
    for (let i=0;i<440;i++) {
      const x=range(0,n), y=range(-25,n), length=range(12,n*.68);
      ctx.strokeStyle=i%3 ? `rgba(32,28,21,${range(.018,.24)})` : `rgba(255,255,248,${range(.09,.38)})`;
      ctx.lineWidth=range(.25,1.9);ctx.beginPath();ctx.moveTo(x,y);
      ctx.bezierCurveTo(x+range(-3,4),y+length*.34,x+range(-4,4),y+length*.7,x+range(-1,2),y+length);ctx.stroke();
    }
    for (let i=0;i<8;i++) {
      const x=range(5,n-5),y=range(0,n);
      for (let k=1;k<5;k++) {
        ctx.strokeStyle=`rgba(60,45,31,${.15/k})`;ctx.beginPath();ctx.ellipse(x,y,k*1.6,k*3.8,.10,0,2*PI);ctx.stroke();
      }
    }
  });
  const paintMap = texture(256,(ctx,n)=>{
    const g=ctx.createLinearGradient(0,0,0,n);
    for (const [t,c] of [[0,'#888f83'],[.12,'#d6d9ca'],[.37,'#f4f3eb'],[.72,'#e6e7da'],[.91,'#c6c8b9'],[1,'#929787']]) g.addColorStop(t,c);
    ctx.fillStyle=g;ctx.fillRect(0,0,n,n);
    for (let i=0;i<840;i++) {
      const x=range(0,n),y=range(0,n);
      ctx.fillStyle=i%5 ? `rgba(51,54,39,${range(.025,.17)})` : `rgba(161,148,116,${range(.14,.53)})`;
      ctx.fillRect(x,y,range(.4,3.5),range(1,26));
    }
    for (let i=0;i<150;i++) {
      const x=range(0,n),y=range(0,n);
      ctx.fillStyle=`rgba(253,249,229,${range(.04,.42)})`;ctx.fillRect(x,y,range(.4,2),range(2,32));
    }
  });
  const grit = texture(512,(ctx,n)=>{
    const pixels=ctx.createImageData(n,n);
    for (let y=0;y<n;y++) for (let x=0;x<n;x++) {
      const i=(y*n+x)*4;
      const low=noise(x*.021,y*.021)*18+noise(x*.113,y*.113)*19;
      const shade=clamp(184+low+range(-28,24),0,255);
      pixels.data.set([shade,shade,shade*.977,255],i);
    }
    ctx.putImageData(pixels,0,0);
  });
  const cloudMap = texture(256,(ctx,n)=>{
    const pixels=ctx.createImageData(n,n);
    // Periodic value noise lets the sky use the same field in every direction.
    function periodic(x,y,cells) {
      const i=floor(x),j=floor(y),a=smooth(0,1,x-i),b=smooth(0,1,y-j);
      return lerp(lerp(hash(i%cells,j%cells),hash((i+1)%cells,j%cells),a),
        lerp(hash(i%cells,(j+1)%cells),hash((i+1)%cells,(j+1)%cells),a),b);
    }
    for (let y=0;y<n;y++) for (let x=0;x<n;x++) {
      let f=0, weight=.55;
      for (const cells of [5,11,21,43,85,127]) {
        f+=periodic(x*cells/n,y*cells/n,cells)*weight; weight*=.53;
      }
      pixels.data.set([f*224,f*224,f*224,255],(y*n+x)*4);
    }
    ctx.putImageData(pixels,0,0);
  },false);

  const sharedSky = {
    zenith:{value:color('#4e94cc')}, horizon:{value:color('#c7dfd9')},
    clouds:{value:color('#f3ede1')}, cloudShade:{value:color('#8aaab9')},
    sunColor:{value:color('#fff2ca')}, sunDir:{value:V(-31,36,24).normalize()},
    cloudMap:{value:cloudMap}, clock:{value:0}, air:{value:1}, seaColor:{value:color('#369b99')}
  };
  const skyGLSL = `
    uniform vec3 zenith,horizon,clouds,cloudShade,sunColor,sunDir,seaColor;
    uniform float clock,air;
    uniform sampler2D cloudMap;
    vec3 sky(vec3 d, float detail){
      float y=max(d.y,0.0);
      vec3 col=mix(horizon,zenith,pow(y,.52));
      float sun=max(dot(d,sunDir),0.0);
      col+=sunColor*(.17*pow(sun,12.0)+1.22*pow(sun,350.0))*air;
      vec2 p=d.xz/(y+.28)*.46+vec2(.033,.27)+vec2(clock*.0012,0.0);
      vec2 q=p*vec2(.86,1.15);
      float a=texture2D(cloudMap,q).r+.12*texture2D(cloudMap,p*2.13+.22).r;
      float b=texture2D(cloudMap,q+vec2(-.017,.013)).r;
      float cover=smoothstep(.488,.592,a)*smoothstep(.024,.22,y);
      float silver=clamp(.44 + (a-b)*5.5 + (a-.5)*1.4,0.,1.);
      col=mix(col,mix(cloudShade,clouds,silver)+sunColor*.12*pow(sun,5.0),cover*detail);
      col+=sunColor*smoothstep(.99948,.99979,sun)*3.5*air;
      return col;
    }
  `;
  const sky = new T.Mesh(new T.SphereGeometry(870,32,20),new T.ShaderMaterial({
    uniforms:sharedSky,side:T.BackSide,depthWrite:false,
    vertexShader:`varying vec3 direction;void main(){direction=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec3 direction;${skyGLSL}
      void main(){gl_FragColor=vec4(sky(normalize(direction),1.0),1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      }`
  }));
  sky.frustumCulled=false;sky.renderOrder=-10;scene.add(sky);
  const hemi = new T.HemisphereLight('#e4f3ff','#c2ae7c',2.05);
  const sun = new T.DirectionalLight('#fff0d0',2.38);
  sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
  Object.assign(sun.shadow.camera,{left:-29,right:29,top:25,bottom:-25,near:1,far:106});
  sun.shadow.camera.updateProjectionMatrix();
  sun.shadow.bias=-.00025; sun.shadow.normalBias=.032;
  scene.add(hemi,sun,sun.target);

  const root = new T.Group();scene.add(root);
  const unitBox=new T.BoxGeometry(1,1,1), unitBall=new T.SphereGeometry(1,12,8);
  const petal=new T.SphereGeometry(1,6,4);
  const unitRod=new T.CylinderGeometry(1,1,1,10,1);
  const up=V(0,1,0), identity=new T.Quaternion();
  const transform=new T.Matrix4();
  const batches=new Map();
  let activeBatches=batches;
  function batch(geo,mat,position,scale,tint='#ffffff',rotation=identity,cast=true,receive=true) {
    if (rotation.isEuler) rotation=new T.Quaternion().setFromEuler(rotation);
    const id=`${geo.id}:${mat.id}:${cast}:${receive}`;
    if (!activeBatches.has(id)) activeBatches.set(id,{geo,mat,cast,receive,matrices:[],colors:[]});
    const row=activeBatches.get(id);
    row.matrices.push(transform.compose(position,rotation,scale).clone());
    row.colors.push(color(tint));
  }
  function flushBatches(records,parent) {
    for(const row of records.values()) {
      const instanced=new T.InstancedMesh(row.geo,row.mat,row.matrices.length);
      for(let i=0;i<row.matrices.length;i++) {
        instanced.setMatrixAt(i,row.matrices[i]);instanced.setColorAt(i,row.colors[i]);
      }
      instanced.instanceMatrix.needsUpdate=true;instanced.instanceColor.needsUpdate=true;
      instanced.castShadow=row.cast;instanced.receiveShadow=row.receive;
      instanced.computeBoundingSphere();parent.add(instanced);
    }
    records.clear();
  }
  const plain=surface('#ffffff');
  const timber=surface('#ffffff',{map:woodMap,roughness:.91});
  const siding=surface('#ffffff',{map:paintMap,roughness:.91});
  const iron=surface('#ffffff',{metalness:.25,roughness:.53});
  const fabric=surface('#ffffff',{side:T.DoubleSide,roughness:1});
  const Euler = (x=0,y=0,z=0)=>new T.Euler(x,y,z);
  function box(x,y,z,w,h,d,tint,mat=plain,rot=identity,cast=true) {
    batch(unitBox,mat,V(x,y,z),V(w,h,d),tint,rot,cast);
  }
  function oval(x,y,z,w,h,d,tint,mat=plain,rot=identity,cast=true) {
    batch(unitBall,mat,V(x,y,z),V(w,h,d),tint,rot,cast);
  }
  function beam(a,b,w,d,tint,mat=timber,cast=true) {
    const u=V(...a),v=V(...b), delta=v.clone().sub(u),length=delta.length();
    if (length<.0001) return;
    batch(unitBox,mat,u.lerp(v,.5),V(w,length,d),tint,new T.Quaternion().setFromUnitVectors(up,delta.normalize()),cast);
  }
  function cylinder(a,b,r,tint,mat=plain,cast=true) {
    const u=V(...a),v=V(...b),delta=v.clone().sub(u),length=delta.length();
    if (length<.0001) return;
    batch(unitRod,mat,u.lerp(v,.5),V(r,length,r),tint,new T.Quaternion().setFromUnitVectors(up,delta.normalize()),cast);
  }
  function mesh(geo,mat,x=0,y=0,z=0,parent=root,cast=true,receive=true) {
    const object=new T.Mesh(geo,mat);
    object.position.set(x,y,z);object.castShadow=cast;object.receiveShadow=receive;parent.add(object);return object;
  }
  function geometry(positions,indices,uvs) {
    const geo=new T.BufferGeometry();
    geo.setAttribute('position',new T.Float32BufferAttribute(positions,3));
    if (indices) geo.setIndex(indices);
    if (uvs) geo.setAttribute('uv',new T.Float32BufferAttribute(uvs,2));
    geo.computeVertexNormals();return geo;
  }
  function cable(a,b,sag,tint='#352e28',r=.028,steps=18) {
    const positions=[];
    for (let i=0;i<=steps;i++) {
      const f=i/steps;
      positions.push(V(lerp(a[0],b[0],f),lerp(a[1],b[1],f)-4*sag*f*(1-f),lerp(a[2],b[2],f)));
    }
    mesh(new T.TubeGeometry(new T.CatmullRomCurve3(positions),steps,r,5,false),surface(tint),0,0,0,root,false);
  }

  function shore(x) {return 11.8+sin(x*.11)*1.7+sin(x*.31)*.45-24*smooth(25,57,x);}
  function landHeight(x,z) {
    const edge=shore(x)-z;
    const dune=(noise(x*.17,z*.21)-.5)*.39+(noise(x*.66,z*.51)-.5)*.10;
    const drive=(1-smooth(3.0,5.2,Math.abs(z+10.5+sin(x*.074)*1.4)))*smooth(0,3,edge);
    return lerp(-.68,lerp(dune,.055,drive),smooth(-2.3,2.8,edge));
  }
  function terrain() {
    const positions=[],uvs=[],indices=[],colors=[];
    const sand=color('#bead82'), shell=color('#e2d6b6'), earth=color('#91815f'), scrub=color('#647748'), road=color('#b9b5a3');
    const rows=119, cols=200;
    for (let j=0;j<=rows;j++) {
      for (let i=0;i<=cols;i++) {
        const x=lerp(-155,155,i/cols), z=lerp(-105,shore(x)+3,j/rows);
        const drive=(1-smooth(2.2,4.5,Math.abs(z+10.6+sin(x*.074)*1.4)))*(.73+noise(x*.5,z*.5)*.27);
        const n=noise(x*.24,z*.29), f=noise(x*.67,z*.72);
        const c=sand.clone().lerp(shell,smooth(.55,.89,f)).lerp(earth,smooth(.70,.91,n)*.53);
        c.lerp(scrub,smooth(.48,.76,n)*smooth(0,2,shore(x)-z)*.82).lerp(road,drive*.92);
        c.lerp(earth,1-smooth(-.4,2.2,shore(x)-z));
        positions.push(x,landHeight(x,z),z);colors.push(c.r,c.g,c.b);uvs.push(x*.35,z*.35);
        if (j<rows && i<cols) {
          const a=j*(cols+1)+i,b=a+cols+1;indices.push(a,b,a+1,b,b+1,a+1);
        }
      }
    }
    const geo=geometry(positions,indices,uvs);
    geo.setAttribute('color',new T.Float32BufferAttribute(colors,3));
    mesh(geo,surface('#ffffff',{map:grit,vertexColors:true,side:T.DoubleSide}),0,0,0,root,false);
  }
  terrain();

  const waterUniforms={...sharedSky,wet:{value:0},fogTint:{value:scene.fog.color}};
  const waterVertex=`varying vec3 localPosition,world;
    void main(){localPosition=position;vec4 p=modelMatrix*vec4(position,1.0);world=p.xyz;gl_Position=projectionMatrix*viewMatrix*p;}`;
  const waterFragment=`${skyGLSL}
    uniform float wet;uniform vec3 fogTint;varying vec3 localPosition,world;
    void main(){
      vec2 p=world.xz;vec3 eye=normalize(cameraPosition-world);float dist=distance(world,cameraPosition);
      float t=clock*(wet>.5?.64:1.0);
      vec3 dx=vec3(sin(p.x*1.71+p.y*.87+t*1.2),sin(p.x*3.2-p.y*2.17-t*1.15),sin(p.y*5.61+p.x*2.2+t*1.8));
      float wave=(dx.x*.65+dx.y*.24+dx.z*.11);
      float attenuation=1.0-smoothstep(24.0,155.0,dist)*.86;

    return solid.top+offset>feet+.001 && solid.bottom+offset<head;

    walk.pitch=clamp(walk.pitch-clamp(my,-120,120)*sens,-PI/2+.015,PI/2-.015);
  });
  window.addEventListener('keydown',event=>{
    if(!walking || document.pointerLockElement!==canvas) return;
    if(event.code==='KeyE') {
      event.preventDefault();
      const item=!event.repeat && nearestInteraction();
      if(item) item.open=!item.open;
      return;
    }
    if(!movementKeys.has(event.code)) return;
    event.preventDefault();
    walkKeys.add(event.code);
    if(event.code==='Space' && !event.repeat) jumpQueued=true;
  });
  window.addEventListener('keyup',event=>walkKeys.delete(event.code));
  window.addEventListener('blur',clearWalkInput);
  document.addEventListener('visibilitychange',clearWalkInput);
  for(const button of settingButtons) button.addEventListener('click',()=>{
    switch(button.dataset.setting) {
      case 'golden': golden=!golden;if(golden) dusk=false;lightingChange=true;break;
      case 'dusk': dusk=!dusk;if(dusk) golden=false;lightingChange=true;break;
      case 'wind': wind=!wind;break;
    }
    const states={golden,dusk,wind};
    for(const item of settingButtons) item.setAttribute('aria-pressed',String(states[item.dataset.setting]));
  });
  function cleanView(enabled) {
    clean.setAttribute('aria-pressed',String(enabled));
    overlay.hidden=enabled;restore.hidden=!enabled;
    (enabled?restore:clean).focus({preventScroll:true});
  }
  clean.addEventListener('click',()=>cleanView(true));restore.addEventListener('click',()=>cleanView(false));
  window.addEventListener('keydown',event=>{
    if(event.key==='Escape' && overlay.hidden && document.pointerLockElement!==canvas) cleanView(false);
  });

  const start=performance.now();let last=start,lastFps=start,frames=0,slow=0;
  function frame(now) {
    const dt=Math.min(.06,(now-last)*.001),t=(now-start)*.001;
    last=now;frames++;
    if(transition) {
      const step=clamp((now-transition.started)/1050,0,1),u=step*step*(3-2*step);
      const angle=transition.yawFrom+transition.yawDelta*u,flat=lerp(transition.flatFrom,transition.flatTo,u);
      controls.target.lerpVectors(transition.fromTarget,transition.end.target,u);
      camera.position.copy(controls.target).add(V(flat*sin(angle),lerp(transition.heightFrom,transition.heightTo,u),flat*cos(angle)));
      camera.fov=lerp(transition.fromFov,transition.end.fov,u);camera.updateProjectionMatrix();
      if(step>=1){transition=null;controls.autoRotate=preset==='orbit';}
    }
    if(walking) {
      updateDoors(dt);
      updateWalk(dt);
      const item=document.pointerLockElement===canvas && nearestInteraction();
      interactionHint.hidden=!item;
      if(item) {
        const label=item===hatch?(item.open?'Tahtayı indir':'Tahtayı kaldır'):(item.open?'Kapıyı kapat':'Kapıyı aç');
        const hint='E — '+label;
        if(interactionHint.textContent!==hint) interactionHint.textContent=hint;
      }
    } else {
      controls.update(dt);
      camera.position.y=Math.max(camera.position.y,.36,landHeight(camera.position.x,camera.position.z)+.32);
    }
    sky.position.copy(camera.position);
    sharedSky.clock.value=t;
    windTime.value=t;
    windForce.value=lerp(windForce.value,wind?1.03:.27,1-Math.exp(-dt*3.3));
    umbrella.rotation.z=sin(t*2.24)*windForce.value*.072;
    umbrella.rotation.x=sin(t*1.57+.3)*windForce.value*.065;
    for(const item of boats) {
      item.model.position.y=-.24+sin(t*1.78+item.phase)*.042;
      item.model.rotation.z=sin(t*1.28+item.phase)*.022;
      item.model.rotation.x=cos(t*1.21+item.phase)*.017;
    }
    for(const {leaf,phase,row,height,speed} of looseLeaves) {
      leaf.visible=wind;
      if(!wind) continue;
      const x=(phase+t*4.2*speed)%38-19;
      leaf.position.set(x,height+sin(t*2.8+phase)*.28,row+sin(t*.84+phase)*1.09);
      leaf.rotation.set(t*2.2+phase,t*1.2+phase,t*2.6+phase);
    }
    updateLighting(t,1-Math.exp(-dt*3.2));
    updateHouseView();
    if(upperInterior.visible) ceilingFan.rotation.y=t*.62;
    renderer.render(scene,camera);
    if(now-lastFps>=580) {
      const rate=Math.round(frames*1000/(now-lastFps));
      fps.textContent=`${rate} FPS`;
      slow=!walking && rate<47?slow+1:0;
      if(slow>=4 && pixelRatio>1 && !document.hidden) {
        pixelRatio=Math.max(1,pixelRatio-.16);resize();slow=0;
      }
      frames=0;lastFps=now;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
