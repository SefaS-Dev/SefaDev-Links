  <rect x="710" y="752" width="420" height="52" rx="26" fill="#3c3c3c"/>
  <rect x="710" y="830" width="320" height="52" rx="26" fill="#3c3c3c"/>
  <!-- metot paneli (açık gri yüzey, alttan taşar) -->
  <rect x="710" y="920" width="900" height="260" rx="52" fill="#363636"/>
  <rect x="770" y="975" width="300" height="80" rx="40" fill="#4c4c4c"/>
  <circle cx="1120" cy="1015" r="40" fill="#2c2c2c"/>

  <!-- Nesne kartı 1 (üst, lavanta vurgulu) -->
  <rect x="565" y="90" width="420" height="300" rx="58" fill="#2a2a2a" stroke="#555555" stroke-width="10"/>
  <rect x="620" y="145" width="310" height="70" rx="35" fill="#b8a4f4"/>
  <rect x="620" y="245" width="220" height="44" rx="22" fill="#424242"/>
  <rect x="620" y="310" width="160" height="44" rx="22" fill="#424242"/>

  <!-- Nesne kartı 2 (sol) -->
