    <path d="M 985 240 H 1110 Q 1170 240 1170 300 V 510"/>
    <path d="M 470 640 H 530 Q 580 640 580 690 V 760 Q 580 810 630 810"/>
  </g>

  <!-- Büyük sınıf kartı (sağ alttan taşar) -->
  <rect x="630" y="510" width="1000" height="700" rx="76" fill="#2c2c2c" stroke="#4a4a4a" stroke-width="10"/>
  <!-- başlık bandı + düğmeler (referanstaki kaydırıcı) -->
  <rect x="710" y="590" width="760" height="112" rx="56" fill="#474747"/>
  <circle cx="1300" cy="646" r="16" fill="#2c2c2c"/>
  <circle cx="1350" cy="646" r="22" fill="#2c2c2c"/>
  <circle cx="1412" cy="646" r="32" fill="#2c2c2c"/>
