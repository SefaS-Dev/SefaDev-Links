<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graf Video</title>
  <style>
:root {
  color-scheme: dark;
  font-family: Consolas, "Courier New", monospace;
  background: #080b0f;
  color: #f6f0df;
}

html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body { overscroll-behavior: none; }
[hidden] { display: none !important; }
button, input { font: inherit; }
.graf-host { position: fixed; inset: 0; overflow: hidden; background: #080b0f; }
.graf-stage {
  --paper: #fff5de;
  --gold: #ffbd57;
  --stroke: #17181d;
  position: absolute;
  top: 50%;
  left: 50%;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  isolation: isolate;
  font-weight: 700;
  background: repeating-linear-gradient(0deg, #111825 0 3px, #121a27 3px 5px);
  transform-origin: 50% 50%;
  user-select: none;
}
.graf-stage > canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
}
.graf-stage > .graf-ink { image-rendering: auto; }
.graf-stage em { color: var(--gold); font-style: normal; }
.graf-top, .graf-cards, .graf-hud-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.graf-top {
  top: 45px;
  bottom: auto;
  left: 286px;
  right: 286px;
  text-align: center;
  line-height: 1.13;
  color: var(--paper);
  paint-order: stroke fill;
  -webkit-text-stroke: 3px var(--stroke);
  text-shadow: 0 4px 0 #17181d, 3px 5px 0 #17181d;
  text-wrap: balance;
}
.graf-opening { font-size: 67px; letter-spacing: 1px; }
.graf-caption { font-size: 45px; letter-spacing: 0.3px; }
.graf-subtitle { margin-top: 7px; font-size: 29px; }

.graf-hud {
  position: absolute;
  left: 42px;
  bottom: 86px;
  display: grid;
  grid-template-columns: 94px minmax(270px, max-content);
  grid-template-rows: 39px 43px;
  column-gap: 18px;
  align-items: center;
  max-width: 968px;
  padding: 9px 25px 9px 14px;
  border: 2px solid #e3af56;
  background:
    radial-gradient(circle at 7px 7px, #906c41 0 2px, transparent 3px),
    radial-gradient(circle at calc(100% - 7px) 7px, #906c41 0 2px, transparent 3px),
    radial-gradient(circle at 7px calc(100% - 7px), #906c41 0 2px, transparent 3px),
    radial-gradient(circle at calc(100% - 7px) calc(100% - 7px), #906c41 0 2px, transparent 3px),
    repeating-linear-gradient(#11151c 0 3px, #141921 3px 5px);
  box-shadow: 0 0 0 3px #332419, inset 0 0 0 3px #68492c, 5px 7px #0c1116a1;
}
.graf-dial {
  position: relative;
  grid-row: 1 / span 2;
  justify-self: center;
  width: 77px;
  height: 77px;
  border: 2px solid #c3934d;
  border-radius: 50%;
  background: radial-gradient(circle at 48% 66%, #242737 4%, #141922 62%, #0d1118 100%);
  box-shadow: 0 0 0 2px #272224, inset 0 0 0 2px #3f3540;
}
.graf-dial-tick { position: absolute; left: 37px; top: 6px; width: 3px; height: 8px; transform-origin: 50% 32.5px; background: #d1bb86; }
.graf-dial-tick:nth-child(even) { width: 2px; height: 5px; background: #8f8a79; }
.graf-needle { position: absolute; left: 36px; top: 15px; width: 4px; height: 30px; transform-origin: 50% 23px; background: #e96d58; box-shadow: 2px 1px #5d2e35; }
.graf-axle { position: absolute; left: 35px; top: 35px; width: 7px; height: 7px; background: #e4ba77; }
.graf-hud-status { align-self: end; font-size: 25px; line-height: 1.2; letter-spacing: 0.8px; color: #ffcd73; }
.graf-hud-row { display: flex; align-items: center; gap: 15px; white-space: nowrap; }
.graf-hud-label { font-size: 22px; color: #e7dbc3; }
.graf-hud-label:empty { display: none; }
.graf-counter { display: flex; gap: 3px; color: #302721; font-size: 29px; }
.graf-drum {
  display: block;
  height: 35px;
  min-width: 23px;
  padding: 0 2px;
  line-height: 35px;
  overflow: hidden;
  text-align: center;
  background: linear-gradient(#ac8f65 0%, #e8d3a9 20%, #fff0c9 48%, #e1cda2 51%, #e4d0ac 79%, #a58b62 100%);
  box-shadow: 0 0 0 1px #796144;
}
.graf-drum-strip, .graf-drum-strip > span { display: block; }
.graf-step {
  position: absolute;
  top: 74px;
  left: 58px;
  padding: 8px 12px;
  font-size: 23px;
  letter-spacing: 1px;
  color: #ffcd73;
  background: #11171ee0;
  border: 1px solid #bd8849;
  box-shadow: 3px 3px #101319;
}

.graf-cards {
  right: auto;
  bottom: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
  align-items: stretch;
}
.graf-cards > * { flex: none; }
.graf-panel {
  box-sizing: border-box;
  min-width: 0;
  padding: 29px 32px 32px;
  border: 2px solid #526476;
  background: repeating-linear-gradient(0deg, #172331 0 3px, #182432 3px 5px);
  box-shadow: inset 0 0 0 3px #1e2f40, 6px 8px #090d14;
  flex-grow: 1;
}
.graf-panel h2 {
  margin: 0 0 22px;
  padding: 0 0 16px;
  border-bottom: 2px solid #546471;
  color: #ffd086;
  font-size: 36px;
  line-height: 1.12;
  letter-spacing: 3px;
}
.graf-panel-lines {
  display: grid;
  gap: 12px;
  list-style: none;
  padding: 0;
  margin: 0;
  font-size: 30px;
  line-height: 1.28;
}
.graf-panel-lines li {
  display: grid;
  grid-template-columns: 10px minmax(0, 1fr);
  align-items: baseline;
  gap: 16px;
  padding: 10px 5px 12px;
  border-bottom: 1px solid #344859;
  overflow-wrap: anywhere;
  color: #ebedf1;
}
.graf-panel-marker { width: 7px; height: 7px; background: #7e9db4; align-self: start; margin-top: 15px; }
.graf-panel-new { background: #40332660; }
.graf-panel-new .graf-panel-marker { width: 10px; height: 10px; background: #ffd16f; }
.graf-panel-lines + .graf-table { margin-top: 24px; }
.graf-card, .graf-table, .graf-formula { text-shadow: 1px 2px #14171ae8; }
.graf-card {
  box-sizing: border-box;
  padding: 28px 32px 32px;
  text-align: left;
  overflow-wrap: anywhere;
  background: #172331;
  border: 2px solid #bd9258;
  box-shadow: 0 0 0 4px #281f19, inset 0 0 0 4px #323238, 7px 11px #0c11177d;
}
.graf-card h2 { color: #ffca75; margin: 0 0 15px; letter-spacing: 3px; font-size: 34px; }
.graf-card p, .graf-card blockquote { margin: 0; font-size: 35px; line-height: 1.2; }
.graf-card-detail { margin-top: 16px; font-size: 26px; color: #d7c8b1; }
.graf-card-quote {
  color: #241b1a;
  background: repeating-linear-gradient(0deg, #eedbbb 0 3px, #ebd7b5 3px 4px);
  border: 0;
  box-shadow: none;
  text-shadow: none;
  clip-path: polygon(0 4%, 3% 1%, 8% 4%, 13% 0, 19% 3%, 25% 1%, 31% 4%, 38% 1%, 46% 3%,
    54% 0, 60% 3%, 65% 1%, 72% 4%, 79% 0, 85% 3%, 93% 1%, 100% 4%, 99% 95%, 93% 98%, 87% 96%,
    82% 100%, 77% 96%, 71% 99%, 65% 96%, 59% 100%, 53% 98%, 48% 100%, 44% 97%, 38% 100%, 32% 97%,
    27% 98%, 21% 96%, 15% 99%, 8% 95%, 4% 99%, 0% 96%);
}
.graf-card-quote h2, .graf-card-quote em, .graf-card-quote .graf-card-detail { color: #764321; }
.graf-exam-count { margin: 20px auto 0; text-align: center; color: #ffca75; font-size: 65px; line-height: 1; }
.graf-answer {
  margin: 24px 0 0;
  padding: 18px 16px 0 53px;
  border-top: 1px solid #b38b545e;
  text-align: left;
  font-size: 30px;
  line-height: 1.22;
}
.graf-answer li + li { margin-top: 9px; }
.graf-answer li::marker { color: #ffca75; }
.graf-table {
  border-collapse: collapse;
  width: 100%;
  max-width: 100%;
  border: 2px solid #526476;
  background: #121a22f2;
  box-shadow: 4px 5px #0f1016a8;
  font-size: 28px;
  font-variant-numeric: tabular-nums;
}
.graf-table th, .graf-table td { padding: 8px 12px; border: 1px solid #435464; overflow-wrap: anywhere; text-align: center; }
.graf-table th { color: #ffcd73; background: #293134; }
.graf-row-active { background: #6a4b2f; }
.graf-yes { color: #aee7b5; }
.graf-no { color: #ffac9e; }
.graf-formula {
  padding: 9px 24px 11px;
  border-top: 2px solid #c59b62;
  border-bottom: 2px solid #c59b62;
  font-size: 35px;
  overflow-wrap: anywhere;
  background: #182122e8;
}

.graf-controls, .graf-chapters { position: absolute; z-index: 2; }
.graf-controls {
  bottom: 0;
  left: 0;
  right: 0;
  padding: 1px 46px 14px;
  background: linear-gradient(transparent, #0a0d14ed 45%);
  display: grid;
  grid-template-columns: auto auto 1fr auto auto;
  align-items: center;
  gap: 0 18px;
}
.graf-controls button, .graf-chapters button {
  border: 1px solid #786041;
  background: #171e26eb;
  color: #f9e7c5;
  border-radius: 0;
  padding: 5px 11px;
  font-size: 23px;
  font-weight: 700;
  cursor: pointer;
}
.graf-controls button:hover, .graf-chapters button:hover, .graf-chapters button[aria-current="true"] {
  color: #ffd389;
  background: #352c25;
}
.graf-controls button:focus-visible, .graf-chapters button:focus-visible, .graf-scrub:focus-visible {
  outline: 3px solid #ffcf7a;
  outline-offset: 2px;
}
.graf-controls .graf-time { font-size: 22px; color: #ddd6c9; text-shadow: 1px 2px #15121a; }
.graf-scrub-area { position: relative; grid-column: 1 / -1; height: 31px; }
.graf-progress { position: absolute; top: 13px; left: 0; right: 0; height: 5px; background: #7980808c; }
.graf-progress b { display: block; width: 100%; height: 100%; background: #e7a74c; transform-origin: 0 50%; }
.graf-marker { position: absolute; top: -3px; width: 3px; height: 11px; background: #fff3cd; }
.graf-scrub {
  appearance: none;
  position: absolute;
  inset: 0;
  margin: 0;
  width: 100%;
  height: 31px;
  background: transparent;
  cursor: ew-resize;
  touch-action: none;
}
.graf-scrub::-webkit-slider-thumb { appearance: none; width: 12px; height: 19px; border: 2px solid #16181b; background: #ffcf7a; }
.graf-scrub::-moz-range-thumb { width: 10px; height: 17px; border: 2px solid #16181b; border-radius: 0; background: #ffcf7a; }
.graf-chapters { top: 34px; right: 39px; min-width: 186px; text-align: right; }
.graf-chapter-list {
  position: absolute;
  top: calc(100% + 7px);
  right: 0;
  width: max-content;
  max-width: 630px;
  max-height: 760px;
  overflow: auto;
  border: 1px solid #9b794f;
  background: #141b23f5;
  box-shadow: 4px 5px #0c1116ad;
}
.graf-chapter-list button { display: block; width: 100%; text-align: left; border-width: 0 0 1px; }
.graf-controls, .graf-chapters { transition: opacity 160ms linear; }
.graf-stage[data-controls="off"] :is(.graf-controls, .graf-chapters):not(:has(:focus-visible)) { opacity: 0; pointer-events: none; }
.graf-error { margin: auto; max-width: 55ch; padding: 1.5rem; position: absolute; top: 20%; left: 10%; right: 10%; font-size: 1rem; line-height: 1.5; }

</style>
